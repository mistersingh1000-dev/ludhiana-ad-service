name: Add Pricing Anchor

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_pricing_anchor.py'
      - '.github/workflows/add-pricing-anchor.yml'

permissions:
  contents: write

jobs:
  add-anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add pricing anchor
        run: python scripts/add_pricing_anchor.py
      - name: Commit pricing anchor
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add direct pricing section link"
          git push
