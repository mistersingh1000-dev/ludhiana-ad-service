name: Bust Public Results Cache
on:
  push:
    paths:
      - 'scripts/bust_public_results_cache.py'
      - '.github/workflows/bust-public-results-cache.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/bust_public_results_cache.py
      - name: Commit homepage cache bust
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh homepage public results cache'
          git push
