name: Inject CRM Latest Sync
on:
  push:
    paths:
      - 'scripts/inject_crm_latest_sync.py'
      - '.github/workflows/inject-crm-latest-sync.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/inject_crm_latest_sync.py
      - run: |
          if git diff --quiet -- crm/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm/index.html
          git commit -m 'Load latest screenshot sync in CRM'
          git push
