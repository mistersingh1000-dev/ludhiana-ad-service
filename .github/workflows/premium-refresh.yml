name: Premium Homepage Refresh

on:
  push:
    branches: [main]
    paths:
      - 'scripts/premium_refresh.py'
      - '.github/workflows/premium-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply premium homepage refresh
        run: python scripts/premium_refresh.py

      - name: Commit homepage refresh
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Premium homepage refresh and WhatsApp CTA"
          git push
