<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludhiana Ad Service Results & Testimonials</title><style>body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f6f3ff;color:#18152b}.hero{padding:60px 20px;text-align:center;color:#fff;background:linear-gradient(135deg,#4612c9,#7c2cff 45%,#ff2d7a)}.wrap{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e8e2ff;border-radius:16px;padding:18px;box-shadow:0 10px 30px #47208a12}.num{font-size:28px;font-weight:900;background:linear-gradient(90deg,#6c2cff,#ff2d7a);-webkit-background-clip:text;color:transparent}.muted{color:#716b86;font-size:13px}.table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden}.table th,.table td{padding:12px;border-bottom:1px solid #eee;text-align:left}.table th{background:#fbfaff;color:#716b86}.testimonial{background:#fff;border:1px solid #e8e2ff;border-radius:16px;padding:18px;margin:14px 0}.stars{color:#ff8a00}.proof{max-width:100%;border-radius:12px;margin-top:10px}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:16px}}</style></head><body><div class="hero"><h1>Ludhiana Ad Service</h1><h2>Campaign Results & Customer Testimonials</h2><p>Selected client performance records and customer feedback.</p></div><div class="wrap"><div id="stats" class="grid"></div><h2 style="margin-top:34px">Latest Campaign Results</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Client</th><th>Campaign</th><th>Messages</th><th>Cost/Result</th><th>Reach</th><th>Impressions</th></tr></thead><tbody id="rows"></tbody></table></div><h2 style="margin-top:34px">Testimonials</h2><div id="tests"></div></div><script>const d=JSON.parse(localStorage.getItem('las_live_crm_v1')||'{"clients":[],"results":[],"testimonials":[]}');d.clients=d.clients||[];d.results=d.results||[];d.testimonials=d.testimonials||[];const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});function latest(cid){return d.results.filter(r=>r.clientId===cid).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||Number(b.id)-Number(a.id))[0]}let current=d.clients.map(c=>({c,r:latest(c.id)})).filter(x=>x.r);document.getElementById('stats').innerHTML=`<div class="card"><div class="muted">Clients with Results</div><div class="num">${current.length}</div></div><div class="card"><div class="muted">Total Messaging Conversations</div><div class="num">${current.reduce((a,x)=>a+Number(x.r.messages||0),0)}</div></div><div class="card"><div class="muted">Testimonials</div><div class="num">${d.testimonials.filter(t=>t.public==='yes').length}</div></div>`;document.getElementById('rows').innerHTML=current.map(({c,r})=>`<tr><td><b>${c.name}</b></td><td>${r.campaign}</td><td>${r.messages||0}</td><td>${money(r.cost)}</td><td>${r.reach||0}</td><td>${r.impressions||0}</td></tr>`).join('')||'<tr><td colspan="6">Results will appear here after they are added.</td></tr>';document.getElementById('tests').innerHTML=d.testimonials.filter(t=>t.public==='yes').map(t=>{let c=d.clients.find(x=>x.id===t.clientId);return `<div class="testimonial"><div class="stars">${'★'.repeat(Number(t.rating||5))}</div><h3>${c?c.name:'Customer'}</h3><p>${t.text}</p>${t.proof?`<img class="proof" src="${t.proof}" alt="testimonial proof">`:''}</div>`}).join('')||'<div class="testimonial">Customer testimonials will appear here once approved.</div>';</script></body></html>
