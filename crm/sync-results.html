count spend limit reached. Schedule shown: 20 Aug 2026–22 Sep 2026'});let star=client('Star Health Insurance','star health engagement ad','Paused','2026-08-27');result(star,{tag:'verified-star-health-engagement-2026-08-27',campaign:'star health engagement ad',date:'2026-08-27',status:'Paused / Off',messages:114,cost:21.60,reach:0,impressions:0,spend:2462.10,dailyBudget:0,proof:'Uploaded Meta Ads screenshot',notes:'Not delivering; account spending limit reached'});result(star,{tag:'verified-star-health-agent-2026-08-27',campaign:'star health agent ad campaign',date:'2026-08-26',status:'Completed',messages:27,cost:18.67,reach:0,impressions:0,spend:504.02,dailyBudget:0,proof:'Uploaded Meta Ads screenshot',notes:'Ended recently / Off'});let brown=client('Brown Beans Cake','Brown beans cake ad campaign','Active','2026-08-27');result(brown,{tag:'verified-brown-beans-2026-08-27',campaign:'Brown beans cake ad campaign',date:'2026-08-27',status:'Active',messages:23,cost:80.81,reach:21204,impressions:33524,spend:1858.59,dailyBudget:300,proof:'Uploaded Meta Ads screenshot',notes:'Ad set shown: Brown beans cake ad set'});let malwa=client('Malwa Nutrition Center','Malwa Nutrition center campaign','Paused','2026-08-12');result(malwa,{tag:'verified-malwa-2026-08-26',campaign:'Malwa Nutrition center campaign',date:'2026-08-26',status:'Paused / Off',messages:47,cost:22.95,reach:28171,impressions:44534,spend:1078.74,dailyBudget:200,proof:'Uploaded Meta Ads screenshot',notes:'Schedule shown: 12 Aug 2026–26 Aug 2026'});d.activity.unshift({title:'Screenshot batch synced',detail:'Added/updated Sumit Malerkotla LIC, Star Health Insurance, Brown Beans Cake and confirmed Malwa Nutrition results.',time:new Date().toLocaleString('en-IN')});localStorage.setItem(DK,JSON.stringify(d));document.getElementById('msg').innerHTML='<span class="ok">✓ Verified results updated successfully.</span><br><br>4 client records / campaigns processed. Duplicate screenshots were not added twice.';</script>
