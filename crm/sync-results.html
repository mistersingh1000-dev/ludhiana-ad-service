<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sync CRM Results</title><style>body{font-family:Arial,sans-serif;background:#f6f3ff;color:#18152b;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fff;padding:28px;border-radius:18px;max-width:620px;box-shadow:0 12px 35px #47208a20}h1{color:#6c2cff}.ok{color:#00875a;font-weight:700}a{display:inline-block;margin-top:15px;padding:12px 18px;border-radius:10px;background:linear-gradient(90deg,#6c2cff,#ff2d7a);color:white;text-decoration:none;font-weight:700}</style><div class="box"><h1>CRM Results Sync</h1><p id="msg">Updating verified campaign results…</p><a href="index.html">Open CRM</a></div><script>const DK='las_live_crm_v1';const seed={clients:[],results:[],payments:[],testimonials:[],activity:[]};let d=JSON.parse(localStorage.getItem(DK)||'null')||structuredClone(seed);d.clients=d.clients||[];d.results=d.results||[];d.payments=d.payments||[];d.testimonials=d.testimonials||[];d.activity=d.activity||[];const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();function client(name,campaign,status,start){let c=d.clients.find(x=>norm(x.name)===norm(name));if(!c){c={id:Date.now()+Math.floor(Math.random()*1e6),name,campaign,status,start};d.clients.push(c)}else{c.name=name;c.campaign=campaign;c.status=status;c.start=c.start||start}return c}function result(c,r){let old=d.results.find(x=>x.tag===r.tag);r.clientId=c.id;if(old)Object.assign(old,r);else d.results.push(Object.assign({id:Date.now()+Math.floor(Math.random()*1e6)},r))}function payment(c,p){let old=d.payments.find(x=>x.tag===p.tag);p.clientId=c.id;if(old)Object.assign(old,p);else d.payments.push(Object.assign({id:Date.now()+Math.floor(Math.random()*1e6)},p))}let lic=client('Sumit Malerkotla','lic agency campaign- sumit malerkotla - 5locations','Paused','2026-08-20');result(lic,{tag:'verified-sumit-lic-2026-08-27',campaign:'lic agency campaign- sumit malerkotla -
